name: refresh-ledger

# Re-renders the ledger assets on the 1st of each month so the masthead
# dateline ("UPDATED YYYY-MM-DD") never goes stale. Commits only when the
# render actually changed.

on:
  schedule:
    - cron: "37 9 1 * *" # 09:37 UTC on the 1st, off the busy marks
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install font tooling
        run: pip install fonttools brotli

      - name: Regenerate ledger assets
        run: python tools/ledger.py

      - name: Render social preview PNG
        id: social
        continue-on-error: true
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python - <<'EOF'
          import base64
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          # Inline the SVG as a data URI: newer runner Chromium blocks
          # file->file subresource loads from an unrelated directory.
          svg = base64.b64encode(Path("assets/social.svg").read_bytes()).decode()
          html = ("<!doctype html><html><head><style>*{margin:0;padding:0;"
                  "overflow:hidden}img{display:block;width:1280px;height:640px}"
                  "</style></head><body>"
                  f'<img src="data:image/svg+xml;base64,{svg}"></body></html>')
          Path("/tmp/social-card.html").write_text(html)

          with sync_playwright() as p:
              b = p.chromium.launch()
              page = b.new_page(viewport={"width": 1280, "height": 640})
              page.goto("file:///tmp/social-card.html")
              page.wait_for_load_state("networkidle")
              page.wait_for_timeout(500)  # let the SVG raster settle
              page.screenshot(path="assets/social-preview.png")
              b.close()

          out = Path("assets/social-preview.png")
          if out.stat().st_size < 20000:
              raise SystemExit("social preview suspiciously small — render failed")
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh ledger for $(date -u +%Y-%m)"
            git push
          fi
